spring.application.name=quiz-app

# Enable the H2 console
spring.h2.console.enabled=true
# Customize the console path (optional, default is /h2-console)
spring.h2.console.path=/h2-console

# Configure database connection (in-memory mode)
spring.datasource.url=jdbc:h2:mem:quizdb
spring.datasource.username=sa
spring.datasource.password=password

# Optional: Display SQL statements
spring.jpa.show-sql=true

